<title>AgriMarket – Farmer Market Intelligence</title>

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f6f9;--sf:#ffffff;--ink:#0f1f2e;--mut:#55677a;--ln:#dde5ec}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1520;--sf:#132231;--ink:#eaf1f7;--mut:#9fb2c4;--ln:#233649}}
:root[data-theme=dark]{--bg:#0b1520;--sf:#132231;--ink:#eaf1f7;--mut:#9fb2c4;--ln:#233649}
html{font-size:clamp(15px,.55vw + 9px,26px);scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.55 'Inter','Noto Sans','Noto Sans Telugu','Noto Sans Devanagari',system-ui,sans-serif}
h1,h2,h3{font-family:'DM Serif Display','Noto Sans Telugu','Noto Sans Devanagari',Georgia,sans-serif;margin:0;line-height:1.15}
h2{font-size:2rem}h3{font-size:1.2rem;margin-bottom:.6rem}
.scr{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.brand{background:linear-gradient(150deg,#0c2d48,#0f5f7a 55%,#0f766e 85%,#b45309);color:#fff;padding:clamp(1.5rem,5vw,4rem);display:flex;flex-direction:column;justify-content:center;gap:1rem}
.brand h1{font-size:clamp(2.4rem,5vw,4.4rem);font-weight:800}.brand p{font-size:1.15rem;max-width:34ch;opacity:.95}
.brand .em{font-size:3rem;letter-spacing:.3rem}
.box{display:flex;flex-direction:column;justify-content:center;padding:clamp(1.5rem,5vw,4rem);max-width:34rem;width:100%;margin:auto}
.tabs{display:flex;gap:.5rem;margin-bottom:1rem}
.tabs button,.btn{font:600 1rem inherit;font-family:inherit;border:0;border-radius:.8rem;padding:.7rem 1.2rem;cursor:pointer}
.tabs button{background:var(--sf);color:var(--ink);border:2px solid var(--ln);flex:1}.tabs .on{background:#3730a3;color:#fff;border-color:#3730a3}
.btn{background:linear-gradient(135deg,#b45309,#f59e0b);color:#fff;box-shadow:0 .4rem 1rem #b4530940}
.btn.g{background:linear-gradient(135deg,#0f766e,#14b8a6);box-shadow:0 .4rem 1rem #0f766e40}
.btn.o{background:var(--sf);color:var(--ink);border:2px solid var(--ln);box-shadow:none}
:focus-visible{outline:3px solid #3730a3;outline-offset:2px}
label{display:block;font-size:.9rem;color:var(--mut);margin:.7rem 0 .2rem}
input,select{width:100%;font:inherit;padding:.7rem .9rem;border:2px solid var(--ln);border-radius:.7rem;background:var(--sf);color:var(--ink)}
.err{color:#be123c;min-height:1.4rem;font-size:.9rem;margin:.5rem 0}
.lg{display:grid;gap:1rem;margin:1.5rem 0}
.lg button{display:flex;align-items:center;gap:1rem;font:600 1.5rem inherit;font-family:inherit;padding:1.1rem 1.4rem;border-radius:1rem;border:3px solid var(--ln);background:var(--sf);color:var(--ink);cursor:pointer;text-align:left}
.lg button.on{border-color:#0f766e;background:#e3f4f2;color:#0b3b37}.lg small{display:block;font-size:.85rem;color:var(--mut);font-weight:400}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:linear-gradient(90deg,#0c2d48,#134e6f);display:flex;align-items:center;gap:.4rem;padding:.6rem 1rem;overflow-x:auto;color:#fff}
.logo{font:800 1.4rem 'DM Serif Display',sans-serif;margin-right:.8rem;white-space:nowrap}
header a{padding:.45rem .9rem;border-radius:99px;color:#e6f2ff;cursor:pointer;white-space:nowrap;font-weight:500}
header a:hover{background:#ffffff30}header a.on{background:#fff;color:#0b3b37}
header select{width:auto;margin-left:auto;padding:.35rem .6rem;border-radius:99px}
header .btn{padding:.4rem .9rem;box-shadow:none}
main{max-width:100rem;margin:0 auto;padding:1.5rem 1rem 4rem}
.sub{color:var(--mut);margin:.2rem 0 1.2rem}
.hero{background:linear-gradient(120deg,#0c2d48,#1e5a8a 60%,#0f766e);color:#fff;border-radius:1.5rem;padding:clamp(1.5rem,4vw,3.5rem);margin-bottom:1.2rem}
.hero h2{font-size:clamp(2rem,4.5vw,3.6rem)}.hero p{max-width:50ch;font-size:1.1rem}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:1rem;margin:1rem 0}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,26rem),1fr));gap:1rem;margin-top:1rem}
.tile,.kpi{background:linear-gradient(135deg,var(--a),var(--b));color:#fff;border-radius:1.2rem;padding:1.2rem;cursor:pointer;border:0;text-align:left;font:inherit;box-shadow:0 .5rem 1.4rem color-mix(in srgb,var(--a) 35%,transparent)}
.tile{transition:transform .15s}.tile:hover{transform:translateY(-3px)}
.tile b,.kpi b{display:block;font:800 1.5rem 'DM Serif Display','Noto Sans Telugu','Noto Sans Devanagari',sans-serif}.kpi{cursor:default}.tile span{font-size:2rem}.kpi small{opacity:.9}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:1.2rem;padding:1.2rem;min-width:0;box-shadow:0 .3rem 1rem #0000000d}
.br{display:grid;grid-template-columns:7rem 1fr 5.5rem;gap:.6rem;align-items:center;margin:.55rem 0;font-size:.95rem}
.br i{display:block;height:1rem;border-radius:.5rem;background:linear-gradient(90deg,var(--a),var(--b))}.br b{text-align:right}
.up{color:#0f766e;font-weight:600}.dn{color:#be123c;font-weight:600}
.tag{display:inline-block;padding:.1rem .7rem;border-radius:99px;font-size:.8rem;color:#fff;background:#3730a3}.tag.k{background:#0f766e}.tag.r{background:#b45309}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:.65rem .8rem;border-bottom:1px solid var(--ln);white-space:nowrap}th{color:var(--mut)}
.fb{display:flex;flex-wrap:wrap;gap:.8rem;align-items:end;margin:1rem 0}.fb>*{flex:1 1 12rem}.fb .btn{flex:0 0 auto}
.note{border-left:5px solid #f59e0b;background:color-mix(in srgb,#f59e0b 14%,var(--sf));padding:.6rem 1rem;border-radius:.6rem;font-size:.9rem;margin-top:1rem}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}.chip{padding:.35rem .9rem;border-radius:.8rem;background:color-mix(in srgb,var(--a) 16%,var(--sf));border:2px solid var(--a);font-size:.9rem}
.mk{display:flex;justify-content:space-between;align-items:center;gap:.6rem;padding:.7rem 0;border-bottom:1px solid var(--ln)}
svg{width:100%;height:auto;display:block}
@media(max-width:800px){.scr{grid-template-columns:1fr}.brand{padding:2rem 1.5rem}}
@media(prefers-reduced-motion:reduce){.tile{transition:none}}
@media print{header{display:none}}

.sway{transform-origin:50px 118px;animation:sway 3.6s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes dr{to{stroke-dashoffset:0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.card,.tile,.kpi,.hero{animation:rise .5s both}
.br i{transform-origin:left;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
.dr{stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1.4s ease-out forwards}
.row{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;align-items:flex-end;margin-top:1.2rem}
.row svg{width:clamp(4.5rem,9vw,9rem);height:auto;animation:bob 3s ease-in-out infinite}
.row svg:nth-child(2n){animation-delay:.6s}.row svg:nth-child(3n){animation-delay:1.2s}
.cc{display:flex;flex-direction:column;align-items:center;text-align:center;gap:.2rem}
.cc svg{width:6rem;background:#ffffff26;border-radius:1rem}
.brand .row{justify-content:flex-start}.brand .row svg{width:clamp(3.5rem,6vw,6rem)}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.dr{stroke-dashoffset:0}}
h1,h2,h3,.logo,.tile b,.kpi b{font-weight:400;letter-spacing:-.01em}
.card,.kpi,.tile{border-radius:.9rem}.hero{border-radius:1.1rem}
.card{box-shadow:0 1px 2px #0f1f2e14,0 8px 24px #0f1f2e0f}
.pimg{display:block;object-fit:cover;background:var(--ln)}
.row img{width:clamp(4.5rem,9vw,9rem);aspect-ratio:1;border-radius:50%;border:3px solid #fff;box-shadow:0 6px 18px #0004;animation:bob 3s ease-in-out infinite}
.row img:nth-child(2n){animation-delay:.6s}
.brand .row img{width:clamp(3.5rem,6vw,6rem)}
.cc .pimg{align-self:stretch;width:100%;aspect-ratio:4/3;border-radius:.6rem}
footer{max-width:100rem;margin:0 auto;padding:1rem;color:var(--mut);font-size:.8rem;border-top:1px solid var(--ln)}
.seg{margin-left:auto;display:flex;border:1px solid #ffffff66;border-radius:99px;overflow:hidden;flex:none}.seg button{border:0;background:transparent;color:#e6f2ff;padding:.3rem .8rem;cursor:pointer;font:inherit}.seg .on{background:#fff;color:#0c2d48;font-weight:600}header select{margin-left:0}

const km=(a,b,c,d)=>{const r=x=>x*Math.PI/180,q=Math.sin(r(c-a)/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)**2;return 12742*Math.asin(Math.sqrt(q))};

function CropArt({id,delay=0}){

 else if(k=='cob')top=html`<path d="M50 96 C28 86 26 52 43 38 C40 62 44 82 50 96Z" fill=${l}/><path d="M50 96 C72 86 74 52 57 38 C60 62 56 82 50 96Z" fill=${l}/><ellipse cx="50" cy="50" rx="11" ry="26" fill=${c}/><path d="M44 30V70M50 26V74M56 30V70" stroke="#b8860b" strokeWidth="1.6" strokeDasharray="3 3" opacity=".6"/>`;
 else if(k=='boll')top=html`<path d="M36 50 L50 62 L64 50 L58 42 L42 42Z" fill=${l}/><circle cx="38" cy="38" r="13" fill="#fff" stroke="#d9d9d9"/><circle cx="62" cy="38" r="13" fill="#fff" stroke="#d9d9d9"/><circle cx="50" cy="26" r="13" fill="#fff" stroke="#d9d9d9"/>`;
 else if(k=='pod')top=[[36,62,-25],[64,50,25],[38,36,-20]].map(([x,y,r],i)=>html`<ellipse key=${i} cx=${x} cy=${y} rx="13" ry="5.5" fill=${c} stroke="#0003" transform=${`rotate(${r} ${x} ${y})`}/>`);
 else if(k=='chilli')top=html`<path d="M50 34 C26 52 32 92 58 108 C46 84 56 62 60 40Z" fill=${c}/><path d="M56 36 C78 50 74 84 58 100 C66 80 62 62 58 42Z" fill=${c} opacity=".85"/><path d="M44 34 h22 l-4 8 h-14Z" fill=${l}/>`;
 else top=[[50,30],[41,38],[59,38],[46,22],[54,22],[50,46],[38,48],[62,48]].map(([x,y],i)=>html`<circle key=${i} cx=${x} cy=${y} r="6" fill=${c}/>`);

}

function Num({v}){const [n,setN]=useState(0);useEffect(()=>{let s=null,id;const f=ts=>{s??=ts;const p=Math.min(1,(ts-s)/700);setN(v*p);if(p<1)id=requestAnimationFrame(f)};id=requestAnimationFrame(f);return()=>cancelAnimationFrame(id)},[v]);return rs(n)}
const Chg=({v})=>html`<span className=${v>=0?'up':'dn'}>${v>=0?'▲ +':'▼ '}${v.toFixed(1)}%</span>`;
function Bars({items,hi}){const mx=Math.max(...items.map(i=>i[1]));return items.map((x,i)=>html`<div className="br" style=${sty(i)} key=${x[0]}><span>${x[0]}</span><i style=${{width:x[1]/mx*100+'%',outline:x[0]==hi?'3px solid #3730a3':'none'}}></i><b>${rs(x[1])}</b></div>`)}
function Spark({v,h=70,col='#3730a3'}){const W=300,lo=Math.min(...v),hi=Math.max(...v),y=a=>h-6-(a-lo)/(hi-lo||1)*(h-14),p=v.map((a,i)=>(i*W/(v.length-1)).toFixed(1)+','+y(a).toFixed(1)).join(' ');

 <div className="note">${t('sample')} Sowing and harvest windows are typical for Telangana and Andhra Pradesh; check local advice for your district. Crop pictures come from the images folder; where a photo is missing an illustration is shown.</div></div>`}

/* ---------- login, language, shell ---------- */
async function sha(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return btoa(s)}}
function Auth({onDone}){const [reg,setReg]=useState(false),[f,setF]=useState({nm:'',ph:'',pw:''}),[er,setEr]=useState(''),set=k=>e=>setF({...f,[k]:e.target.value});
 const go=async()=>{const us=store.g('agri_users')||{},ph=f.ph.trim();if(!/^\d{10}$/.test(ph)||f.pw.length<6)return setEr('Enter a 10-digit phone number and a password of 6+ characters.');const h=await sha(f.pw);
  if(reg){if(!f.nm.trim())return setEr('Enter your name.');if(us[ph])return setEr('This phone number is already registered. Please login.');us[ph]={name:f.nm.trim(),h};store.s('agri_users',us);onDone({name:f.nm.trim(),ph})}
  else{if(!us[ph]||us[ph].h!=h)return setEr('Phone number or password is incorrect.');onDone({name:us[ph].name,ph})}};
 return html`<section className="scr"><div className="brand"><h1>AgriMarket</h1><p>Nearby market prices, seasonal crop guidance and advisories for farmers.</p><div className="row">${['Rice','Maize','Cotton','Chilli','Groundnut'].map((c,i)=>html`<${CropArt} key=${c} id=${c} delay=${i*.3}/>`)}</div></div>
 <div className="box"><div className="tabs"><button className=${reg?'':'on'} onClick=${()=>{setReg(false);setEr('')}}>Login</button><button className=${reg?'on':''} onClick=${()=>{setReg(true);setEr('')}}>Register</button></div>
 ${reg&&html`<label htmlFor="nm">Full name</label><input id="nm" value=${f.nm} onChange=${set('nm')} autoComplete="name"/>`}
 <label htmlFor="ph">Phone number (10 digits)</label><input id="ph" inputMode="numeric" maxLength="10" value=${f.ph} onChange=${set('ph')} autoComplete="tel"/>
 <label htmlFor="pw">Password (6+ characters)</label><input id="pw" type="password" value=${f.pw} onChange=${set('pw')} autoComplete=${reg?'new-password':'current-password'}/>
 <div className="err" role="alert">${er}</div><button className="btn" onClick=${go}>${reg?'Create account':'Login'}</button>
 <p className="sub" style=${{fontSize:'.8rem',marginTop:'1rem'}}>Demo: accounts are stored only in this browser. A real deployment needs a secure backend.</p></div></section>`}
function LangPick({lang,onDone}){const [l,setL]=useState(lang);
 return html`<section className="scr"><div className="brand"><div style=${{fontSize:'3rem'}}>🌐</div><h1>Choose language<br/>భాషను ఎంచుకోండి<br/>भाषा चुनें</h1></div><div className="box"><div className="lg">${[['en','English','English'],['te','తెలుగు','Telugu'],['hi','हिन्दी','Hindi']].map(o=>html`<button key=${o[0]} className=${o[0]==l?'on':''} onClick=${()=>setL(o[0])}>${o[1]}<small>${o[2]}</small></button>`)}</div><button className="btn g" onClick=${()=>onDone(l)}>Continue · కొనసాగించండి · आगे बढ़ें</button></div></section>`}

function App(){
 const [S,setS]=useState(()=>{const u=store.g('agri_sess');return{stage:u?'app':'auth',user:u,lang:store.g('agri_lang')||'en',pg:'home',unit:store.g('agri_unit')||'q',loc:[MKS[0].la,MKS[0].lo],mk:MKS[0].n,crop:'Rice',sea:'All',msg:'locdef'}});
 const up=p=>setS(s=>({...s,...p})),lang=S.lang;
 UNIT=S.unit;
 const t=k=>k=='qt'&&S.unit=='kg'?T[lang].kg:(T[lang][k]??T.en[k]),cn=c=>lang=='en'?c.id:c.n[lang=='te'?0:1],sname=s=>s=='K'?t('kh'):s=='R'?t('rb'):t('zd');
 const nr=useMemo(()=>MKS.map(m=>({m,d:km(S.loc[0],S.loc[1],m.la,m.lo)})).sort((a,b)=>a.d-b.d),[S.loc]);
 useEffect(()=>{document.documentElement.lang=lang},[lang]);
 useEffect(()=>{scrollTo(0,0)},[S.pg]);
 if(S.stage=='auth')return html`<${Auth} onDone=${u=>{store.s('agri_sess',u);up({user:u,stage:'lang'})}}/>`;
 if(S.stage=='lang')return html`<${LangPick} lang=${lang} onDone=${l=>{store.s('agri_lang',l);up({lang:l,stage:'app',pg:'home'})}}/>`;
 const PG={home:Home,dash:Dash,place:Place,prices:Prices,adv:Advisory,crops:Crops}[S.pg]||Home;
 return html`<${Ctx.Provider} value=${{S,up,t,cn,sname,nr,lang}}><header><span className="logo">🌾 AgriMarket</span>${['home','place','dash','prices','adv','crops'].map(k=>html`<a key=${k} tabIndex="0" className=${k==S.pg?'on':''} onClick=${()=>up({pg:k})} onKeyDown=${e=>e.key=='Enter'&&up({pg:k})}>${t(k)}</a>`)}
 <div className="seg" role="group" aria-label="Unit"><button className=${S.unit=='q'?'on':''} onClick=${()=>{store.s('agri_unit','q');up({unit:'q'})}}>${t('uq')}</button><button className=${S.unit=='kg'?'on':''} onClick=${()=>{store.s('agri_unit','kg');up({unit:'kg'})}}>${t('uk')}</button></div><select aria-label="Language" value=${lang} onChange=${e=>{store.s('agri_lang',e.target.value);up({lang:e.target.value})}}><option value="en">English</option><option value="te">తెలుగు</option><option value="hi">हिन्दी</option></select><button className="btn o" onClick=${()=>{store.s('agri_sess',null);up({stage:'auth',user:null})}}>${t('out')}</button></header>
 <main><${PG} key=${S.pg+lang}/></main><footer>© AgriMarket · Indicative prices for guidance only, not live market rates. Consult your local KVK or agriculture officer before decisions.</footer><//>`}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script></body></html>
